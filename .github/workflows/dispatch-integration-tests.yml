# Reusable: dispatches the internal repo's integration-tests workflow for a
# given commit, waits for it to complete, and fails if it doesn't succeed.
# Shared by pr.yml (per-PR) and release.yml (pre-release gate) so the
# dispatch/poll logic only exists once.
name: Dispatch integration tests

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit in this repo to test"
        required: true
        type: string
    secrets:
      RUNNER_PAT:
        required: true

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # Generous outer bound: time to notice the run plus the internal
    # workflow's own 90-minute timeout.
    timeout-minutes: 105
    steps:
      # workflow_dispatch (not repository_dispatch) targets the internal
      # repo's integration-tests.yml by name and, on API version 2026-03-10+,
      # returns workflow_run_id directly - no need to poll and guess which
      # run resulted from the dispatch.
      - name: Trigger integration tests (internal repo)
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
        run: |
          run_id=$(gh api repos/cloudian/s3-rdma-connector-for-pytorch-internal/actions/workflows/integration-tests.yml/dispatches \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f ref=main \
            -F "inputs[sha]=${{ inputs.sha }}" \
            --jq .workflow_run_id)

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "Dispatch response did not include workflow_run_id - check the API version pin above" >&2
            exit 1
          fi
          echo "Watching run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for integration tests to complete
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          REPO: cloudian/s3-rdma-connector-for-pytorch-internal
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          for i in $(seq 1 100); do
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)
              echo "integration tests concluded: $conclusion"
              [ "$conclusion" = "success" ]
              exit $?
            fi
            sleep 60
          done

          echo "Timed out waiting for integration tests run $RUN_ID" >&2
          exit 1
