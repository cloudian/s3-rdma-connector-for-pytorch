# Reusable: dispatches the internal repo's integration-tests workflow for a
# given commit, waits for it to complete, and fails if it doesn't succeed.
# Shared by pr.yml (per-PR) and release.yml (pre-release gate) so the
# dispatch/poll logic only exists once.
name: Dispatch integration tests

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit in this repo to test"
        required: true
        type: string
    secrets:
      RUNNER_PAT:
        required: true

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # Generous outer bound: time to notice the run plus the internal
    # workflow's own 90-minute timeout.
    timeout-minutes: 105
    steps:
      - name: Trigger integration tests (internal repo)
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api repos/cloudian/s3-rdma-connector-for-pytorch-internal/dispatches \
            -f event_type=integration-tests \
            -F "client_payload[sha]=${{ inputs.sha }}"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      # The internal workflow doesn't report status back to this repo, so
      # poll its run directly. Looked up repo-wide (not by workflow file) so
      # this file doesn't need to name the internal workflow. Correlates by
      # "first run created since we dispatched" - good enough given the
      # internal workflow's own concurrency group serializes these runs one
      # at a time.
      - name: Wait for integration tests run to start
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          REPO: cloudian/s3-rdma-connector-for-pytorch-internal
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh api "repos/$REPO/actions/runs?event=repository_dispatch&per_page=10" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$SINCE\")] | sort_by(.created_at) | .[0].id // empty")
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Could not find the dispatched integration tests run in $REPO" >&2
            exit 1
          fi
          echo "Watching $REPO run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for integration tests to complete
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          REPO: cloudian/s3-rdma-connector-for-pytorch-internal
          RUN_ID: ${{ steps.find_run.outputs.run_id }}
        run: |
          for i in $(seq 1 100); do
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)
              echo "integration tests concluded: $conclusion"
              [ "$conclusion" = "success" ]
              exit $?
            fi
            sleep 60
          done

          echo "Timed out waiting for integration tests run $RUN_ID" >&2
          exit 1
