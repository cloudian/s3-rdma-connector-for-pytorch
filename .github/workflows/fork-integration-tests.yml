# Lets a maintainer opt a fork PR into integration tests via the
# "run-integration-tests" label. 
# The label is stripped on every new push, add it back to 
# test changes.
name: Fork integration tests

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-integration-tests' &&
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/dispatch-integration-tests.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  unlabel-on-push:
    name: Remove run-integration-tests label
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove label and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label run-integration-tests
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Removed \`run-integration-tests\` after new commits were pushed. Re-apply the label to re-run integration tests on the new commit."
