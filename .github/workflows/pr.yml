name: CI

on:
  pull_request:

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python lint
        run: source ./venv.sh && ./python-lint.sh

  integration-tests:
    name: Integration tests
    # Only dispatch for PRs from this repo - add the  `run-integration-tests` label 
      # to run integration tests from forks- see
      # fork-integration-tests.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/dispatch-integration-tests.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
