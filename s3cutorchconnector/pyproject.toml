[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "s3cutorchconnector"
version = "0.0.7"
description = "S3 hosted dataset loader for PyTorch, using rdma for data transfer"
requires-python = ">=3.8"

dependencies = [
    "torch >= 2.0.1, != 2.5.0",
    "botocore @ git+https://github.com/cloudian/botocore.git@1.43.75+rdma",
    "pylru >= 1.3.1",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 140
disable = "missing-class-docstring,missing-module-docstring,missing-function-docstring,duplicate-code,import-error"

[project.optional-dependencies]
dcp = [
    "tenacity",
    "torch >= 2.3, != 2.5.0",
]

lightning = [
    "lightning >= 2.0",
    "packaging",
]

test = [
    "s3cutorchconnector[dcp]",
    "s3cutorchconnector[lightning]",
    "pytest",
]
